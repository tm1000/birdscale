name: image

# Publishes ghcr.io/<owner>/<repo> and, when configured, Docker Hub:
#   tag v1.2.3  -> 1.2.3, 1.2, 1 (the 1 is skipped for 0.x) and latest
#   push to main -> main and sha-<short>
#
# Docker Hub is optional. To enable it, set in the repo settings:
#   variable DOCKERHUB_USERNAME    Docker Hub user that owns the access token
#   variable DOCKERHUB_REPOSITORY  e.g. myuser/birdscale
#   secret   DOCKERHUB_TOKEN       Docker Hub access token with Read & Write scope
# With DOCKERHUB_REPOSITORY unset, only GHCR is published.
on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # QEMU runs the arm64 apt-get layer of the runtime stage. The Go build
      # and the tarball downloads cross-compile / run natively.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: vars.DOCKERHUB_REPOSITORY != ''
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          # The second line is empty (and ignored) when Docker Hub isn't configured.
          images: |
            ghcr.io/${{ github.repository }}
            ${{ vars.DOCKERHUB_REPOSITORY != '' && format('docker.io/{0}', vars.DOCKERHUB_REPOSITORY) || '' }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=branch
            type=sha
          # Adds the org.opencontainers.image.* labels (source, revision,
          # created, version, ...) on top of the ones in the Dockerfile.
          labels: |
            org.opencontainers.image.title=birdscale
            org.opencontainers.image.description=Bridge a Tailscale tailnet to a NetBird network

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
